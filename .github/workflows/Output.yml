name: Output example
run-name: workflow example for Output, executed for ${{github.actor}}
on:
    workflow_dispatch:
jobs:
    generating_Output:
        runs-on: ubuntu-latest
        steps:
            - name: Generating Output with shell
              id: output-example
              run: |
                ACTION_RANDOM=$(( $RANDOM))
                echo "action_random=ACTION_RANDOM" >> $GITHUB_OUTPUT

            - name: Showing output action example    
              run: echo "${{steps.output-example.outputs.action_random}}"
